services:
  - type: web
    name: chatterbox-tts-app
    env: python
    pythonVersion: "3.9"
    region: oregon # Or any other preferred Render region like frankfurt
    buildCommand: "pip install --no-cache-dir -r requirements.txt ."
    startCommand: "python src/chatterbox/gradio_tts_app.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
      - key: GRADIO_ENABLE_QUEUE # To ensure Gradio queue is enabled, if needed by the app's settings
        value: "true" 
        # Add other environment variables if discovered to be necessary, e.g., for model paths
